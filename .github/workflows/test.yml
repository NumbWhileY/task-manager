name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Day 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Day 2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          psql -h localhost -U postgres -d task_manager_test -f migrations/001_create_tasks.sql
          psql -h localhost -U postgres -d task_manager_test -f migrations/002_create_users.sql
          psql -h localhost -U postgres -d task_manager_test -f migrations/003_add_user_id_to_tasks.sql
        env:
          PGPASSWORD: 1234

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: 1234
          DB_NAME: task_manager_test
          DB_NAME_TEST: task_manager_test
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test